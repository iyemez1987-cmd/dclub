plugins { id 'com.android.application' }

android {
    namespace 'com.posim.dclub'
    compileSdk 34
    defaultConfig {
        applicationId 'com.posim.dclub'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../dclub.keystore')
            storePassword 'dclub2026'
            keyAlias 'dclub'
            keyPassword 'dclub2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
