name: APK derle
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Derle
        run: gradle -p android assembleRelease --no-daemon
      - name: APK'yı yayınla
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dclub.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dclub.apk
          git commit -m "APK güncellendi" || exit 0
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with: { name: dclub-apk, path: dclub.apk }
